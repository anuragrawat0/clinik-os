name: CI

on:
  pull_request:
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned pnpm before enabling the setup-node cache
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check dependency boundaries
        run: pnpm boundary:check

      - name: Audit production dependencies
        run: pnpm audit --prod

      - name: Build
        run: pnpm build

      - name: Check committed OpenAPI and client snapshots
        run: git diff --exit-code -- apps/api/openapi/openapi.json apps/web/src/lib/api-client/schema.d.ts

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      COMPOSE_PROJECT_NAME: clinik-os-smoke

    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Start the stack on fresh volumes
        run: docker compose --env-file .env.example up --build -d

      - name: Verify API, web, MinIO and worker startup
        run: |
          set -e

          wait_for_url() {
            local url="$1"
            local name="$2"

            echo "Waiting for $name at $url"

            for attempt in $(seq 1 45); do
              if curl --fail --silent --show-error "$url"; then
                echo ""
                echo "$name is healthy."
                return 0
              fi

              echo "$name not ready (attempt $attempt/45). Retrying..."
              sleep 2
            done

            echo "$name failed to become healthy." >&2
            return 1
          }

          wait_for_url "http://127.0.0.1:3001/api/v1/health" "API"
          wait_for_url "http://127.0.0.1:3000/" "Web"

          docker compose --env-file .env.example exec -T minio mc ready local

          for attempt in $(seq 1 30); do
            if docker compose --env-file .env.example logs worker | grep -q 'pg-boss worker process started'; then
              echo "Worker started successfully."
              exit 0
            fi

            sleep 2
          done

          echo 'Worker did not report pg-boss startup.' >&2
          exit 1

      - name: Verify migration rollback and reapply
        run: |
          set -e

          docker compose --env-file .env.example stop api worker web

          docker compose --env-file .env.example run --rm migrate node dist/core/db/migrate.js down

          docker compose --env-file .env.example run --rm migrate node dist/core/db/migrate.js up

          docker compose --env-file .env.example up -d api worker web

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3001/api/v1/health; then
              echo ""
              echo "API recovered successfully after migrations."
              exit 0
            fi

            echo "Waiting for API after migrations ($attempt/45)..."
            sleep 2
          done

          echo "API failed to recover after migrations." >&2
          exit 1

      - name: Debug Docker containers on failure
        if: failure()
        run: |
          echo "===== Container status ====="
          docker compose --env-file .env.example ps -a || true

          echo "===== API logs ====="
          docker compose --env-file .env.example logs --tail=200 api || true

          echo "===== Web logs ====="
          docker compose --env-file .env.example logs --tail=100 web || true

          echo "===== Worker logs ====="
          docker compose --env-file .env.example logs --tail=100 worker || true

          echo "===== Database logs ====="
          docker compose --env-file .env.example logs --tail=100 postgres || true

      - name: Remove fresh-volume smoke stack
        if: always()
        run: docker compose --env-file .env.example down -v
