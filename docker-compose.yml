name: clinik-os

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-clinik_os}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Set POSTGRES_SUPERUSER_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-clinik_os}
      CLINIC_MIGRATOR_PASSWORD: ${CLINIC_MIGRATOR_PASSWORD:?Set CLINIC_MIGRATOR_PASSWORD in .env}
      CLINIC_APP_PASSWORD: ${CLINIC_APP_PASSWORD:?Set CLINIC_APP_PASSWORD in .env}
      CLINIC_WORKER_PASSWORD: ${CLINIC_WORKER_PASSWORD:?Set CLINIC_WORKER_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/bootstrap/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -p 5432 -U postgres -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9
    pull_policy: missing
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test:
        - CMD-SHELL
        - 'mc alias set local http://127.0.0.1:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" --api S3v4 >/dev/null 2>&1 && mc ready local'
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '127.0.0.1:1025:1025'
      - '127.0.0.1:8025:8025'
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    command: ['node', 'dist/core/db/migrate.js', 'up']
    init: true
    environment:
      NODE_ENV: development
      SERVICE_NAME: migrator
      MIGRATOR_DATABASE_URL: postgresql://clinic_migrator:${CLINIC_MIGRATOR_PASSWORD:?Set CLINIC_MIGRATOR_PASSWORD in .env}@postgres:5432/${DB_NAME:-clinik_os}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      NODE_ENV: development
      SERVICE_NAME: api
      LOG_LEVEL: info
      API_PORT: 3001
      # Only the web container (static address below) may set X-Forwarded-For (D28).
      TRUSTED_PROXY_CIDRS: ${WEB_IP:-172.28.0.10}/32
      DATABASE_URL: postgresql://clinic_app:${CLINIC_APP_PASSWORD:?Set CLINIC_APP_PASSWORD in .env}@postgres:5432/${DB_NAME:-clinik_os}
    init: true
    # Not published to the host: the API is reached only through web (same-origin /api).
    expose:
      - '3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3001/api/v1/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    command: ['node', 'dist/worker.js']
    init: true
    environment:
      NODE_ENV: development
      SERVICE_NAME: worker
      LOG_LEVEL: info
      WORKER_DATABASE_URL: postgresql://clinic_worker:${CLINIC_WORKER_PASSWORD:?Set CLINIC_WORKER_PASSWORD in .env}@postgres:5432/${DB_NAME:-clinik_os}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        API_INTERNAL_ORIGIN: http://api:3001
    environment:
      NODE_ENV: production
    init: true
    networks:
      default:
        ipv4_address: ${WEB_IP:-172.28.0.10}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/api/v1/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-172.28.0.0/24}

volumes:
  postgres_data:
  minio_data:
