name: clinik-os

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-clinik_os}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-local_postgres_superuser_password}
      DB_NAME: ${DB_NAME:-clinik_os}
      CLINIC_MIGRATOR_PASSWORD: ${CLINIC_MIGRATOR_PASSWORD:-local_clinic_migrator_password}
      CLINIC_APP_PASSWORD: ${CLINIC_APP_PASSWORD:-local_clinic_app_password}
      CLINIC_WORKER_PASSWORD: ${CLINIC_WORKER_PASSWORD:-local_clinic_worker_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/bootstrap/001-roles.sh:/docker-entrypoint-initdb.d/001-roles.sh:ro
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d $${POSTGRES_DB}']
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-clinik_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local_minio_root_password}
    volumes:
      - minio_data:/data
    ports:
      - '9000:9000'
      - '9001:9001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - '1025:1025'
      - '8025:8025'
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    command: ['pnpm', 'db:migrate']
    environment:
      NODE_ENV: development
      SERVICE_NAME: migrator
      MIGRATOR_DATABASE_URL: postgresql://clinic_migrator:${CLINIC_MIGRATOR_PASSWORD:-local_clinic_migrator_password}@postgres:5432/${DB_NAME:-clinik_os}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    environment:
      NODE_ENV: development
      SERVICE_NAME: api
      LOG_LEVEL: info
      API_PORT: 3001
      DATABASE_URL: postgresql://clinic_app:${CLINIC_APP_PASSWORD:-local_clinic_app_password}@postgres:5432/${DB_NAME:-clinik_os}
    ports:
      - '3001:3001'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3001/api/v1/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    command: ['pnpm', 'worker:start']
    environment:
      NODE_ENV: development
      SERVICE_NAME: worker
      LOG_LEVEL: info
      WORKER_DATABASE_URL: postgresql://clinic_worker:${CLINIC_WORKER_PASSWORD:-local_clinic_worker_password}@postgres:5432/${DB_NAME:-clinik_os}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    environment:
      NODE_ENV: production
      API_INTERNAL_ORIGIN: http://api:3001
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
